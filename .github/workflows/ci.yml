
name: CI

# Validation only. This workflow never publishes.
# Can be called by publish_npm.yml.

on:
  workflow_call: {}
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]

    defaults:
      run:
        working-directory: quasar_resaas

    steps:
      - name: Checkout quasar_resaas
        uses: actions/checkout@v4
        with:
          path: quasar_resaas

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: quasar_resaas/package-lock.json

      - name: Install dependencies
        run: npm ci


  secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
