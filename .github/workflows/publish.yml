
name: Publish npm package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Update npm CLI for trusted publishing
        run: npm install --global npm@latest

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: ${GITHUB_REF_NAME}"
            echo "Expected format: v0.0.1466"
            exit 1
          fi

          if [[ "$VERSION" != "$TAG_VERSION" ]]; then
            echo "Release tag does not match package version."
            echo "Tag:     ${TAG_VERSION}"
            echo "Package: ${VERSION}"
            exit 1
          fi

          echo "Version validated: ${VERSION}"

      - name: Install dependencies
        run: npm ci

      - name: Skip if this version already exists
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).name")"
          VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          ERROR_FILE="$(mktemp)"

          if npm view "${PACKAGE}@${VERSION}" version \
            >/dev/null 2>"${ERROR_FILE}"; then
            echo "${PACKAGE}@${VERSION} is already published."
            echo "Skipping duplicate publication."
            exit 0
          fi

          if grep -q "E404" "${ERROR_FILE}"; then
            echo "${PACKAGE}@${VERSION} is not published yet."
          else
            cat "${ERROR_FILE}"
            rm -f "${ERROR_FILE}"
            exit 1
          fi

          rm -f "${ERROR_FILE}"

      - name: Publish package to npm
        run: npm publish --access public
